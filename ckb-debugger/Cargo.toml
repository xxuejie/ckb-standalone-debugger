[package]
name = "ckb-debugger"
description = "Standalone debugger for Nervos CKB"
version = "0.113.0"
license = "MIT"
authors = ["Nervos Core Dev <dev@nervos.org>"]
edition = "2021"

[features]
default = ["probes"]
stdio = ["ckb-vm-debug-utils/stdio"]
probes = ["probe", "ckb-script/flatmemory"]

[dependencies]
clap = "2.33.0"
# ckb-chain-spec = "=0.113.0"
ckb-chain-spec = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
ckb-debugger-api = { path = "../ckb-debugger-api", version="0.113.0" }
# ckb-hash = "=0.113.0"
ckb-hash = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
ckb-mock-tx-types = { path = "../ckb-mock-tx-types", version="0.113.0" }
# ckb-script = { version = "=0.113.0", default-features = false }
ckb-script = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d", default-features = false }
# ckb-types = "=0.113.0"
ckb-types = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
# ckb-vm = { version = "=0.24.6" }
ckb-vm = { git = "https://github.com/xxuejie/ckb-vm", rev = "f31b1c2" }
ckb-vm-debug-utils = { path = "../ckb-vm-debug-utils", version="0.113.0" }
ckb-vm-pprof = { path = "../ckb-vm-pprof", version="0.113.0" }
env_logger = "0.4.3"
ckb-gdb-remote-protocol = { path = "../ckb-gdb-remote-protocol", version="0.113.0" }
gdbstub = "0.6.6"
gdbstub_arch = "0.2.4"
hex = "0.4"
lazy_static = "1.4.0"
libc = "0.2.132"
log = "0.4.0"
rand = "0.8.5"
serde_json = "1.0"
serde_plain = "1.0"
probe = { version = "0.5.0", optional = true }
