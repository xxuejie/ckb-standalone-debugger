[package]
name = "ckb-debugger-api"
description = "Standalone debugger for Nervos CKB"
version = "0.113.0"
license = "MIT"
authors = ["Nervos Core Dev <dev@nervos.org>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ckb-hash = "=0.113.0"
# ckb-chain-spec = "=0.113.0"
# ckb-jsonrpc-types = "=0.113.0"
ckb-hash = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
ckb-chain-spec = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
ckb-jsonrpc-types = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
ckb-mock-tx-types = { path = "../ckb-mock-tx-types", version="0.113.0" }
# ckb-script = { version = "=0.113.0", default-features = false }
ckb-script = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d", default-features = false }
# ckb-types = "=0.113.0"
ckb-types = { git = "https://github.com/xxuejie/ckb", rev = "2fbf14d" }
# ckb-vm = "=0.24.6"
ckb-vm = { git = "https://github.com/xxuejie/ckb-vm", rev = "f31b1c2" }
hex = "0.4"
regex = "1"
serde = { version="1.0", features = ["derive"] }
serde_json = "1.0"
serde_plain = "1.0"
wasm-bindgen = "0.2.50"

[dev-dependencies]
byteorder = "1.3.2"
